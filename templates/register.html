<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ATS Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/history.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
</head>

<body>
    <nav class="site-nav" aria-label="Main navigation">
        <a class="brand" href="/" aria-label="ATS Resume Analyzer home">
            <span class="brand-mark">A</span>
            <span>ATS Analyzer</span>
        </a>
        <a class="home-btn" href="/">Home</a>
    </nav>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="auth-title">
            <p class="eyebrow">Get started</p>
            <h1 id="auth-title">Create your account</h1>
            <p class="auth-intro">Save your resume checks and keep your progress in one place.</p>

            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form class="auth-form" action="/auth/register" method="post">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ email | default('', true) }}" autocomplete="email" required>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="auth-field">
                    <label for="confirm_password">Confirm password</label>
                    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
        </section>
    </main>
</body>

</html>
